# Render blueprint for the read-only public demo.
# Pulls the multi-arch image from GHCR and runs it with DEMO_MODE=true so
# the seed script populates SQLite with three demo scans on every boot.
# Render's free tier has no persistent disk; the DB lives in /tmp and is
# re-seeded on every cold start, which is exactly what we want for a demo.
#
# NOTE: updating the pin below does NOT redeploy the service by itself —
# Render redeploys via its deploy hook (see .github/workflows/deploy-demo.yml,
# which fires it on every release once RENDER_DEPLOY_HOOK is set) or from
# the dashboard. If the live demo lags the releases, that hook is the fix.
services:
  - type: web
    name: lanscope-demo
    runtime: image
    image:
      url: ghcr.io/dannyruizb/lanscope:1.26.0
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: DB_PATH
        value: "/tmp/lanscope-demo.db"
      # v1.12.0 — latency threshold alerts: 50 ms sits above the demo's wired
      # devices and inside the WiFi devices' sway, so the seeded scans show a
      # couple of high_latency alerts out of the box without flooding.
      # v1.18.0 — the seeded Windows desktop has 3389 open, so the demo shows
      # one sensitive_port alert out of the box (the seed runs the real
      # detector, which reads this variable).
      - key: SENSITIVE_PORTS
        value: "23,445,3389"
      - key: LATENCY_ALERT_MS
        value: "50"
