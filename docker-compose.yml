services:
  lanscope:
    build: .
    image: ghcr.io/dannyruizb/lanscope:1.27.0
    container_name: lanscope
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    environment:
      PORT: 3030
      DB_PATH: /var/lib/lanscope/lanscope.db
      # Optional HTTP Basic Auth — set BOTH to lock the UI and the API
      # (LanScope refuses to start with only one of them set):
      # AUTH_USER: ops
      # AUTH_PASS: change-me
      # Optional housekeeping — purge ACKNOWLEDGED alerts N days after the
      # ack (pending alerts are never touched; unset = keep everything):
      # ALERT_RETENTION_DAYS: 30
      # Optional watchlist — raise an alert when any of these TCP ports is
      # found OPEN on a host (unset = off):
      # SENSITIVE_PORTS: "23,445,3389,5900"
    volumes:
      - lanscope-data:/var/lib/lanscope

volumes:
  lanscope-data:
