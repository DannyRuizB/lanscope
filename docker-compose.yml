services:
  lanscope:
    build: .
    image: ghcr.io/dannyruizb/lanscope:1.13.0
    container_name: lanscope
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    environment:
      PORT: 3030
      DB_PATH: /var/lib/lanscope/lanscope.db
      # Optional HTTP Basic Auth — set BOTH to lock the UI and the API
      # (LanScope refuses to start with only one of them set):
      # AUTH_USER: ops
      # AUTH_PASS: change-me
    volumes:
      - lanscope-data:/var/lib/lanscope

volumes:
  lanscope-data:
