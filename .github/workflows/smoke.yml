name: Smoke test

# Fast sanity check on every push and PR to main: parses every server-side
# JS file, builds the image, runs it, and probes the read-only endpoints.
# Catches a broken Dockerfile, a typo in src/, or an endpoint regression
# before the v* tag fires the heavier multi-arch release workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check JS files
        run: |
          set -e
          while IFS= read -r f; do
            node --check "$f"
          done < <(find src -name "*.js")
          echo "All src/**/*.js parsed OK"

      - name: Build image
        run: docker build -t lanscope:smoke .

      - name: Start container
        run: |
          docker run -d --name lanscope-smoke -p 3030:3030 lanscope:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3030/api/config > /dev/null 2>&1; then
              echo "Container responding after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not respond within 30s"
          docker logs lanscope-smoke
          exit 1

      - name: Probe API endpoints
        run: |
          set -e

          echo "--- /api/config ---"
          curl -fsS http://localhost:3030/api/config | tee /tmp/config.json
          echo
          grep -q '"demoMode":false' /tmp/config.json

          echo "--- /api/scans ---"
          curl -fsS http://localhost:3030/api/scans | tee /tmp/scans.json
          echo
          grep -q '"scans":\[\]' /tmp/scans.json

          echo "--- /api/alerts/count ---"
          curl -fsS http://localhost:3030/api/alerts/count | tee /tmp/alerts.json
          echo
          grep -q '"count":0' /tmp/alerts.json

          echo "--- /api/alerts/export (v1.19.0) ---"
          # An empty install exports just the header row — and must say so with
          # the CSV content type and an attachment filename, not a JSON 200.
          curl -fsS -D /tmp/alerts-export.h "http://localhost:3030/api/alerts/export?format=csv" -o /tmp/alerts-export.csv
          grep -qi 'content-type: text/csv' /tmp/alerts-export.h
          grep -qi 'filename="lanscope_alerts_all.csv"' /tmp/alerts-export.h
          grep -q 'id,created_at,acknowledged_at,status,type' /tmp/alerts-export.csv
          curl -fsS "http://localhost:3030/api/alerts/export?format=json" | grep -q '"alerts":\[\]'
          # A bad format must be refused, not silently defaulted.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3030/api/alerts/export?format=xml")
          [ "$code" = "400" ] || { echo "::error::bad format should 400, got $code"; exit 1; }

          echo "--- /api/schedules ---"
          curl -fsS http://localhost:3030/api/schedules | grep -q '"schedules":'

          echo "--- /api/notifications ---"
          curl -fsS http://localhost:3030/api/notifications | grep -q '"channels":'

          echo "--- /api/inventory ---"
          curl -fsS http://localhost:3030/api/inventory | grep -q '"baselines":'

          echo "--- /api/labels (v1.3.0) ---"
          curl -fsS "http://localhost:3030/api/labels?cidr=192.168.0.0%2F24" | grep -q '"labels":\[\]'

          echo "--- /api/mutes (v1.20.0) ---"
          curl -fsS "http://localhost:3030/api/mutes?cidr=192.168.0.0%2F24" | grep -q '"mutes":\[\]'
          # PUT round-trip: mute, see it listed, unmute, gone again.
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":true}' \
            "http://localhost:3030/api/mutes" | grep -q '"ip":"192.168.0.9"'
          curl -fsS "http://localhost:3030/api/mutes?cidr=192.168.0.0%2F24" | grep -q '"ip":"192.168.0.9"'
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":false}' \
            "http://localhost:3030/api/mutes" | grep -q '"mute":null'
          # A non-boolean `muted` must be rejected, not coerced.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":"yes"}' \
            "http://localhost:3030/api/mutes")
          [ "$code" = "400" ]
          # v1.21.0 — type-scoped mutes: the scope round-trips, a full set
          # canonicalizes to null, and garbage scopes are rejected.
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":true,"types":["high_latency"]}' \
            "http://localhost:3030/api/mutes" | grep -q '"types":\["high_latency"\]'
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":true,"types":["appeared","disappeared","changed_mac","changed_hostname","changed_os","changed_ports","high_latency","sensitive_port"]}' \
            "http://localhost:3030/api/mutes" | grep -q '"types":null'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":true,"types":["nonsense"]}' \
            "http://localhost:3030/api/mutes")
          [ "$code" = "400" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":true,"types":[]}' \
            "http://localhost:3030/api/mutes")
          [ "$code" = "400" ]
          curl -fsS -X PUT -H 'content-type: application/json' \
            -d '{"cidr":"192.168.0.0/24","ip":"192.168.0.9","muted":false}' \
            "http://localhost:3030/api/mutes" | grep -q '"mute":null'

          echo "--- /api/timeline (v1.5.0) ---"
          curl -fsS "http://localhost:3030/api/timeline?cidr=192.168.0.0%2F24" | grep -q '"points":\[\]'

          echo "--- /api/host-history (v1.7.0) ---"
          curl -fsS "http://localhost:3030/api/host-history?cidr=192.168.0.0%2F24&ip=192.168.0.1" | grep -q '"points":\[\]'

          echo "--- /api/latency-sparks (v1.9.0) ---"
          curl -fsS "http://localhost:3030/api/latency-sparks?cidr=192.168.0.0%2F24" | grep -q '"sparks":{}'

          echo "--- /api/host-history/export (v1.10.0) ---"
          curl -fsS "http://localhost:3030/api/host-history/export?cidr=192.168.0.0%2F24&ip=192.168.0.1&format=csv" | grep -q 'scan_id,started_at,present'

          echo "--- schedules keep_last (v1.8.0) ---"
          # Round-trips the retention field; enabled=false so the cron never ticks.
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"smoke retention","cidr":"192.168.0.0/24","cron_expr":"0 3 * * *","enabled":false,"keep_last":24}' \
            http://localhost:3030/api/schedules | grep -q '"keep_last":24'
          curl -fsS http://localhost:3030/api/schedules | grep -q '"keep_last":24'

          echo "--- schedules latency_alert_ms (v1.14.0) ---"
          # Per-schedule threshold round-trips; enabled=false, never ticks.
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"smoke latency","cidr":"192.168.0.0/24","cron_expr":"0 4 * * *","enabled":false,"latency_alert_ms":120}' \
            http://localhost:3030/api/schedules | grep -q '"latency_alert_ms":120'
          curl -fsS http://localhost:3030/api/schedules | grep -q '"latency_alert_ms":120'

          echo "--- notifications daily_digest event (v1.15.0) ---"
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"smoke digest","type":"webhook","config":{"url":"https://example.invalid/hook"},"events":["daily_digest"],"enabled":false}' \
            http://localhost:3030/api/notifications | grep -q '"daily_digest"'
          curl -fsS http://localhost:3030/api/notifications | grep -q '"daily_digest"'

          echo "--- notifications sensitive_port event (v1.18.0) ---"
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"smoke sensitive","type":"webhook","config":{"url":"https://example.invalid/hook"},"events":["sensitive_port"],"enabled":false}' \
            http://localhost:3030/api/notifications | grep -q '"sensitive_port"'

          echo "--- notifications high_latency event (v1.13.0) ---"
          # The event must round-trip the allowlist; enabled=false, never fires.
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"smoke latency","type":"webhook","config":{"url":"https://example.invalid/hook"},"events":["high_latency"],"enabled":false}' \
            http://localhost:3030/api/notifications | grep -q '"high_latency"'
          curl -fsS http://localhost:3030/api/notifications | grep -q '"high_latency"'

          echo "--- send digest now (v1.16.0) ---"
          # Fires the digest on demand; the disabled smoke channels above aren't
          # subscribed, so it's a safe no-op that still exercises the endpoint.
          curl -fsS -X POST http://localhost:3030/api/digest/run | grep -q '"ok":true'

          echo "--- config export / import dry run (v1.23.0, v1.24.0) ---"
          curl -fsS -o /tmp/backup.json http://localhost:3030/api/config/export
          grep -q '"lanscope_config"' /tmp/backup.json
          # Re-importing the instance's own backup as a DRY RUN must report a
          # plan and write nothing: every schedule/channel name already exists,
          # so they all land in "skipped".
          curl -fsS -X POST "http://localhost:3030/api/config/import?dry_run=1" \
            -H 'content-type: application/json' --data-binary @/tmp/backup.json \
            -o /tmp/dryrun.json
          grep -q '"dry_run":true' /tmp/dryrun.json
          grep -q '"plan"' /tmp/dryrun.json

          echo "--- GET / ---"
          curl -fsS -o /tmp/index.html -w "code=%{http_code}\n" http://localhost:3030/
          grep -q '<title>LanScope' /tmp/index.html

          echo "All endpoints responded with expected shape"

      - name: Container logs on failure
        if: failure()
        run: docker logs lanscope-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f lanscope-smoke || true
